# Supabase-compatible REST stack for integration tests:
#   Postgres (with TrueAI's real migration) → PostgREST → nginx at /rest/v1
#
#   docker compose -f tests/integration/docker-compose.yml up -d
#   TRUEAI_TEST_SUPABASE_URL=http://127.0.0.1:54321 pytest
#   docker compose -f tests/integration/docker-compose.yml down -v
name: trueai-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supabase_stub.sql:/docker-entrypoint-initdb.d/00_supabase_stub.sql:ro
      - ../../supabase/migrations/20260929000000_trueai_v2.sql:/docker-entrypoint-initdb.d/10_trueai_v2.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: trueai-integration-tests-jwt-secret-0123456789
      PGRST_DB_CHANNEL_ENABLED: "false"

  gateway:
    image: nginx:1.27-alpine
    depends_on: [rest]
    ports:
      - "54321:80"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $$host; }
        }
        EOF
        exec nginx -g 'daemon off;'
